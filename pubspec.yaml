name: driver_app
description: A new Flutter project.
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1        
  riverpod_annotation: ^2.6.1     

  go_router: ^15.1.2              

  # HTTP / WS / Storage
  http: ^1.3.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2

  # Utils
  url_launcher: ^6.2.5
  phone_numbers_parser: ^8.0.0
  clipboard: ^0.1.3
  lottie: ^3.3.1
  country_flags: ^3.2.0
  cupertino_icons: ^1.0.8


  # Data classes
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

# ─────────────────────────────────────────────────────────
# ⬇︎ DEVELOPMENT-TIME DEPENDENCIES
# ─────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Riverpod / Freezed code-gen
  build_runner: ^2.4.6
  riverpod_generator: ^2.4.0
  freezed: ^2.4.5
  json_serializable: ^6.7.1   # code-gen חלק מה-dev

  # דלפק שרת מקומי
  dhttpd: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/animations/check.json
