name: driver_app
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5
  web_socket_channel: ^3.0.3
  provider: ^6.0.0
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  freezed: ^2.4.5
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

  country_flags: ^3.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  lottie: ^3.3.1


dev_dependencies:
  build_runner: ^2.4.6
  dhttpd: ^4.0.0

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/animations/check.json


